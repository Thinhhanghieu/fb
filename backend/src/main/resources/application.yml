# Spring Boot Application Configuration
spring:
  application:
    name: fb-clone-backend
  
  # Database Configuration (Neon PostgreSQL)
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-winter-butterfly-amzapjhy.c-5.us-east-1.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_vUJwd9cGpbs3}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update # Tự động tạo/cập nhật bảng dựa trên Entity
    show-sql: true # Hiển thị câu lệnh SQL trong console (dễ debug)
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Security / JWT Configuration
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970} # 256-bit secret
      expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

# App Custom Configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Server Configuration
server:
  port: 8080
  error:
    include-message: always # Hiển thị lỗi chi tiết hơn (chỉ dùng cho môi trường dev)

# Logging
logging:
  level:
    org.springframework.security: DEBUG
    com.fbclone: DEBUG
